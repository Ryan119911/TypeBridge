name: Build TypeBridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile TypeBridge.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            throw "Windows .NET Framework C# compiler not found: $csc"
          }
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /codepage:65001 `
            /win32icon:"assets\typebridge.ico" `
            /out:"TypeBridge.exe" `
            /reference:System.dll `
            /reference:System.Drawing.dll `
            /reference:System.Windows.Forms.dll `
            /reference:System.Web.Extensions.dll `
            "TypeBridge.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "TypeBridge.exe" | Select-Object FullName, Length

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: TypeBridge-windows
          path: TypeBridge.exe
          if-no-files-found: error

  ubuntu-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Ubuntu package
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="3.2.0"
          fi
          bash ubuntu/build-deb.sh

      - name: Upload Ubuntu DEB
        uses: actions/upload-artifact@v4
        with:
          name: TypeBridge-ubuntu-deb
          path: dist/typebridge_*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-exe, ubuntu-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: TypeBridge-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/TypeBridge.exe
            release-assets/typebridge_*.deb
