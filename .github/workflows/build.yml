name: 构建 TypeBridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    name: 编译 Windows 程序
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 写入版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "tag 不是版本号：$v" }
          $p = "TypeBridge.cs"
          $s = [System.IO.File]::ReadAllText($p)
          $pattern = 'AssemblyVersion\("\d+\.\d+\.\d+\.\d+"\)'
          # 不能用「替换前后字符串是否相同」判断有没有匹配：源码版本与 tag 一致时
          # 替换是幂等的，会被误判成"没找到 AssemblyVersion"。
          if ($s -notmatch $pattern) { throw "没找到 AssemblyVersion" }
          $s2 = [regex]::Replace($s, $pattern, ('AssemblyVersion("' + $v + '.0")'))
          [System.IO.File]::WriteAllText($p, $s2, (New-Object System.Text.UTF8Encoding($true)))

      - name: 编译并测试 Windows 程序
        shell: pwsh
        run: ./build.ps1 -Test

      - name: 上传 Windows 程序
        uses: actions/upload-artifact@v4
        with:
          name: TypeBridge-windows
          path: TypeBridge.exe
          if-no-files-found: error

  ubuntu-deb:
    name: 打包 Ubuntu 安装包
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 验证 Ubuntu 协议、文件和 X11 输入
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 xdotool xvfb x11-utils
          /usr/bin/python3 tests/run_linux.py

      - name: 构建 DEB 安装包
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="3.8.0"
          fi
          bash ubuntu/build-deb.sh

      - name: 上传 Ubuntu 安装包
        uses: actions/upload-artifact@v4
        with:
          name: TypeBridge-ubuntu-deb
          path: dist/typebridge_*.deb
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-exe, ubuntu-deb]
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: TypeBridge-*
          path: release-assets
          merge-multiple: true

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/TypeBridge.exe
            release-assets/typebridge_*.deb
