name: 构建 TypeBridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    name: 编译 Windows 程序
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 编译 TypeBridge.exe
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            throw "未找到 Windows 自带的 .NET Framework C# 编译器：$csc"
          }
          # 设置窗口用 WPF 编写（WpfSettings.cs），需要引用 WPF 程序集
          $wpf = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\WPF"
          if (-not (Test-Path (Join-Path $wpf "PresentationFramework.dll"))) {
            $wpf = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\WPF"
          }
          if (-not (Test-Path (Join-Path $wpf "PresentationFramework.dll"))) {
            throw "未找到 WPF 程序集：$wpf"
          }
          $xaml = Get-ChildItem -Path "$env:WINDIR\Microsoft.NET\assembly\GAC_MSIL\System.Xaml" -Filter "System.Xaml.dll" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          $cscArgs = @(
            "/nologo", "/target:winexe", "/platform:anycpu", "/optimize+", "/codepage:65001",
            "/win32icon:assets\typebridge.ico",
            "/out:TypeBridge.exe",
            "/reference:System.dll",
            "/reference:System.Drawing.dll",
            "/reference:System.Windows.Forms.dll",
            "/reference:System.Web.Extensions.dll",
            "/reference:$(Join-Path $wpf 'PresentationFramework.dll')",
            "/reference:$(Join-Path $wpf 'PresentationCore.dll')",
            "/reference:$(Join-Path $wpf 'WindowsBase.dll')"
          )
          if ($xaml) { $cscArgs += "/reference:$xaml" }
          $cscArgs += @("TypeBridge.cs", "WpfSettings.cs")
          & $csc @cscArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "TypeBridge.exe" | Select-Object FullName, Length

      - name: 上传 Windows 程序
        uses: actions/upload-artifact@v4
        with:
          name: TypeBridge-windows
          path: TypeBridge.exe
          if-no-files-found: error

  ubuntu-deb:
    name: 打包 Ubuntu 安装包
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 构建 DEB 安装包
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="3.6.0"
          fi
          bash ubuntu/build-deb.sh

      - name: 上传 Ubuntu 安装包
        uses: actions/upload-artifact@v4
        with:
          name: TypeBridge-ubuntu-deb
          path: dist/typebridge_*.deb
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-exe, ubuntu-deb]
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: TypeBridge-*
          path: release-assets
          merge-multiple: true

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/TypeBridge.exe
            release-assets/typebridge_*.deb
